<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Daan en Joep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: één prentenboekpagina per scherm. Boven een smalle balk, daaronder het 3D-diorama op een ronde 'stip',
   daaronder de voorleestekst tussen twee grote bladerknoppen, onderaan stippen als paginanummers. */
:root{
  --paper:#f3f6fb;
  --sheet:#ffffff;
  --ink:#1b2747;
  --ink-soft:#56627f;
  --accent:#ffbd17;
  --accent-ink:#3a2a00;
  --siren:#2b67dc;
  --siren-ink:#ffffff;
  --line:#d8e0ee;
  --shadow:0 22px 44px -22px rgba(27,39,71,.45);
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Verdana","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1426;--sheet:#151e36;--ink:#eef2fb;--ink-soft:#a7b2cc;--accent:#ffc73a;--accent-ink:#2b1f00;
    --siren:#5f90ff;--siren-ink:#0d1426;--line:#28324f;--shadow:0 22px 44px -22px rgba(0,0,0,.8);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1426;--sheet:#151e36;--ink:#eef2fb;--ink-soft:#a7b2cc;--accent:#ffc73a;--accent-ink:#2b1f00;
  --siren:#5f90ff;--siren-ink:#0d1426;--line:#28324f;--shadow:0 22px 44px -22px rgba(0,0,0,.8);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overscroll-behavior:none;
}
.app{
  height:100%;max-width:1080px;margin:0 auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;
  gap:clamp(8px,1.6vh,16px);padding-block:clamp(8px,1.6vh,16px);
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(1.02rem,.9rem + .6vw,1.3rem);line-height:1.05;margin:0}
.top h1 span{color:var(--siren)}
.top p{margin:2px 0 0;font-size:.8rem;color:var(--ink-soft)}
.chip{
  font-family:var(--display);font-weight:600;font-size:.95rem;line-height:1;
  border:2px solid var(--line);background:var(--sheet);color:var(--ink);
  border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
}
.chip svg{width:18px;height:18px;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage-box{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.stage{
  position:relative;width:320px;height:240px;max-width:100%;
  border-radius:clamp(18px,3vw,34px);overflow:hidden;
  background:linear-gradient(#bfe2ff,#fff6dc);box-shadow:var(--shadow);
  touch-action:pan-y;cursor:pointer;transition:background .4s ease;
}
.stage canvas{display:block;width:100%;height:100%;transition:opacity .2s ease}
.stage.fade canvas{opacity:0}
.tap{
  position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;
  font-family:var(--display);font-weight:600;font-size:clamp(.8rem,.7rem + .4vw,1rem);
  background:rgba(255,255,255,.88);color:#1b2747;border-radius:999px;padding:6px 12px 6px 8px;
  pointer-events:none;box-shadow:0 6px 14px -8px rgba(0,0,0,.4);
  animation:nudge 2.4s ease-in-out infinite;
}
.tap svg{width:20px;height:20px}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-family:var(--display);color:#1b2747}
.read{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:clamp(10px,2.4vw,28px)}
.nav{
  width:clamp(54px,7vw,70px);height:clamp(54px,7vw,70px);border-radius:50%;border:none;
  background:var(--siren);color:var(--siren-ink);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 10px 20px -12px rgba(27,39,71,.6);transition:transform .12s ease,opacity .2s ease;
}
.nav:active{transform:scale(.94)}
.nav:disabled{opacity:.25;cursor:default}
.nav svg{width:44%;height:44%}
.text{
  margin:0;font-size:clamp(1.15rem,.85rem + 1.55vw,2rem);line-height:1.32;
  text-wrap:balance;min-height:2.64em;transition:opacity .2s ease;
}
.text.out{opacity:0}
.text .klank{font-family:var(--display);font-weight:800;color:var(--siren);letter-spacing:.01em}
.text .titel{display:block;font-family:var(--display);font-weight:800;font-size:1.5em;line-height:1;letter-spacing:-.01em}
.text .titel em{font-style:normal;color:var(--siren)}
.text .sub{display:block;margin-top:.25em;font-size:.8em;color:var(--ink-soft)}
.text .chip{margin-top:.5em;font-size:1rem}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding-bottom:2px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-soft);background:transparent;padding:0;cursor:pointer;transition:transform .2s ease,background .2s ease}
.dot[aria-current="true"]{background:var(--accent);border-color:var(--accent);transform:scale(1.3)}
:focus-visible{outline:3px solid var(--siren);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:520px){
  .top p{display:none}
  .chip .lbl{display:none}
  .read{grid-template-columns:1fr 1fr;row-gap:10px}
  .read .text{grid-column:1 / -1;grid-row:1;min-height:0}
  .read #prev{grid-row:2;justify-self:start}
  .read #next{grid-row:2;justify-self:end}
}
@media (prefers-reduced-motion: reduce){
  .stage canvas,.text,.dot,.nav{transition:none}
  .tap{animation:none}
}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>Agent Daan <span>&amp;</span> Joep</h1>
      <p>Een 3D-prentenboek om samen te lezen. Tik op de plaat en kijk wat er gebeurt.</p>
    </div>
    <button class="chip" id="sound" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <span class="lbl" id="soundLbl">Geluid aan</span>
    </button>
  </header>

  <div class="stage-box" id="stageBox">
    <div class="stage" id="stage">
      <canvas id="scene" role="img" aria-label=""></canvas>
      <div class="tap" id="tap" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M12 10.5V9a1.5 1.5 0 0 1 3 0v2"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7L4 15.5a1.6 1.6 0 0 1 2.6-1.8L9 16V11"/></svg>
        <span id="tapText"></span>
      </div>
    </div>
  </div>

  <div class="read">
    <button class="nav" id="prev" type="button" aria-label="Vorige bladzijde">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
    </button>
    <p class="text" id="text" aria-live="polite"></p>
    <button class="nav" id="next" type="button" aria-label="Volgende bladzijde">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
    </button>
  </div>

  <nav class="dots" id="dots" aria-label="Bladzijden"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
(() => {
'use strict';

/* ================================================================
   Verhaal
   ================================================================ */
const PAGES = [
  { html:'<span class="titel">Agent Daan <em>&amp;</em> Joep</span><span class="sub">De koekjesboeven</span>',
    alt:'Daan in politiepak zwaait naast een kleine politieauto. Aapje Joep met een politiepetje zit op de motorkap en salueert.',
    tap:'Tik op Joep of op de auto', sky:['#a9d8ff','#fff3d6'], build:pCover },
  { html:'Dit is Daan.<br>En dit is Joep, het aapje van Daan.',
    alt:'Daan staat in zijn kamer en houdt knuffelaapje Joep vast.',
    tap:'Tik op Joep', sky:['#ffe9cf','#fff8ee'], build:pMeet },
  { html:'Daan zet zijn politiepet op.<br>Joep krijgt ook een pet.<br>Nu zijn ze agent!',
    alt:'De politiepet zakt op het hoofd van Daan. Joep staat op een speelgoedkist en krijgt een klein petje.',
    tap:'Tik op de petten', sky:['#ffe9cf','#fff8ee'], build:pCaps },
  { html:'<span class="klank">Nie-nu, nie-nu!</span><br>Daar gaat de politieauto.',
    alt:'Daan en Joep rijden in de politieauto rondjes over de weg. Het blauwe zwaailicht knippert.',
    tap:'Tik op de auto', sky:['#9fd3ff','#eaf7ff'], build:pDrive, enter:() => SFX.siren() },
  { html:'Oh nee! Bij de bakker<br>zijn alle koekjes weg.',
    alt:'De bakker kijkt verdrietig naar een leeg bord. Daan en Joep schrikken.',
    tap:'Tik op de bakker', sky:['#ffd9c2','#fff4e6'], build:pBakerySad },
  { html:'Kijk eens, kruimels!<br>Wie heeft dat gedaan?',
    alt:'Een spoor van koekkruimels in het gras. Daan kijkt door een vergrootglas, Joep wijst.',
    tap:'Tik op de kruimels', sky:['#bfe7c9','#f4fbe9'], build:pCrumbs },
  { html:'Joep klimt in de boom.<br><span class="klank">Hup, hup, hup!</span>',
    alt:'Joep klimt met zijn lange armen in een hoge boom. Daan kijkt omhoog.',
    tap:'Tik op Joep', sky:['#b5e0ff','#f2fbff'], build:pClimb },
  { html:'Joep ziet iets.<br>Daar, achter de struik!',
    alt:'Joep zit op een tak en wijst naar een struik. Achter de struik gluren twee mutsen.',
    tap:'Tik op de struik', sky:['#b5e0ff','#f2fbff'], build:pSpot },
  { html:'Twee boeven met een zak vol koekjes.<br><span class="klank">Smik, smak, smul!</span>',
    alt:'Twee boeven met gestreepte truien en zwarte maskers eten koekjes uit een grote zak.',
    tap:'Tik op een boef', sky:['#c8ecd0','#fbfbe9'], build:pRobbers },
  { html:'<span class="klank">Stop! Politie!</span> roept Daan.<br><span class="klank">Oe-oe-aa-aa!</span> roept Joep.',
    alt:'Daan steekt zijn hand op. Joep springt. De boeven schrikken en steken hun handen omhoog.',
    tap:'Tik op Joep', sky:['#c8ecd0','#fbfbe9'], build:pStop },
  { html:'De boeven schrikken.<br>‘Sorry,’ zeggen ze. ‘We hadden zo’n honger.’',
    alt:'De boeven zitten op een boomstam en kijken sip. Daan staat met zijn handen in zijn zij, Joep zit op zijn schouder.',
    tap:'Tik op een boef', sky:['#ffe3c7','#fff8ec'], build:pSorry },
  { html:'Samen brengen ze de koekjes terug.<br>Iedereen krijgt er één. Joep krijgt er twee!',
    alt:'Bij de bakker staat een bord vol koekjes. Iedereen heeft een koekje, Joep heeft er twee.',
    tap:'Tik op Joep', sky:['#ffd9c2','#fff4e6'], build:pShare },
  { html:'Goed gedaan, agent Daan!<br>Goed gedaan, agent Joep!',
    alt:'Daan en Joep krijgen een gouden medaille. Er dwarrelt confetti en iedereen klapt.',
    tap:'Tik voor confetti', sky:['#ffe7a8','#fff8e4'], build:pMedal },
  { html:'Nu is het bedtijd.<br>Welterusten, agent Daan.<br>Welterusten, Joep.',
    alt:'Daan slaapt in bed met Joep in zijn arm. De politiepet hangt aan het bed. Buiten schijnt de maan.',
    tap:'Tik op de maan', sky:['#1a2550','#33407a'], build:pNight, end:true },
];

/* ================================================================
   DOM
   ================================================================ */
const $ = id => document.getElementById(id);
const stage = $('stage'), stageBox = $('stageBox'), canvas = $('scene');
const textEl = $('text'), prevBtn = $('prev'), nextBtn = $('next'), dotsEl = $('dots');
const tapEl = $('tap'), tapText = $('tapText'), soundBtn = $('sound'), soundLbl = $('soundLbl');
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

PAGES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'dot'; b.type = 'button';
  b.setAttribute('aria-label', i === 0 ? 'Voorkant' : 'Bladzijde ' + i);
  b.addEventListener('click', () => go(i));
  dotsEl.appendChild(b);
});

/* ================================================================
   Geluid (alles wordt in de browser gemaakt, geen bestanden)
   ================================================================ */
let soundOn = true;
try { soundOn = localStorage.getItem('daan-geluid') !== 'uit'; } catch (e) {}
let AC = null;
function ac() {
  if (!soundOn) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, at, dur, type, vol, f2) {
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || .12, t0 + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + .05);
}
const SFX = {
  siren() { for (let i = 0; i < 4; i++) tone(i % 2 ? 587 : 784, i * .42, .4, 'triangle', .11); },
  boing() { tone(200, 0, .38, 'sine', .22, 640); },
  pop()   { tone(700, 0, .09, 'square', .05, 1300); },
  hup()   { tone(392, 0, .13, 'triangle', .14, 560); },
  chime() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .09, .55, 'sine', .09)); },
  monkey(){ [[520, 760], [520, 760], [760, 430], [760, 430]].forEach(([a, b], i) => tone(a, i * .19, .16, 'square', .045, b)); },
  sad()   { tone(440, 0, .3, 'triangle', .1, 330); tone(330, .28, .4, 'triangle', .1, 247); },
  tink()  { tone(1568, 0, .25, 'sine', .08); },
  lullaby(){ [523, 523, 784, 784, 880, 880, 784].forEach((f, i) => tone(f, i * .32, .5, 'sine', .07)); },
  crunch() {
    const a = ac(); if (!a) return;
    const n = Math.floor(a.sampleRate * .2), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2) * (Math.random() < .35 ? 1 : .25);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = .8; g.gain.value = .5;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  },
};
function renderSound() {
  soundBtn.setAttribute('aria-pressed', String(soundOn));
  soundLbl.textContent = soundOn ? 'Geluid aan' : 'Geluid uit';
  soundBtn.setAttribute('aria-label', soundOn ? 'Geluid uitzetten' : 'Geluid aanzetten');
  $('waves').style.display = soundOn ? '' : 'none';
}
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem('daan-geluid', soundOn ? 'aan' : 'uit'); } catch (e) {}
  renderSound(); if (soundOn) SFX.pop();
});
renderSound();

/* ================================================================
   Three.js basis
   ================================================================ */
const T = window.THREE;
let renderer = null;
if (T) {
  try {
    T.ColorManagement.legacyMode = false;
    renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { renderer = null; }
}
if (!renderer) {
  const d = document.createElement('div'); d.className = 'nogl';
  d.textContent = 'Dit apparaat kan de 3D-platen niet laten zien. De tekst kun je wel voorlezen.';
  stage.appendChild(d); canvas.style.display = 'none';
}

let ENV = null, camera = null;
if (renderer) {
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .9;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const pmrem = new T.PMREMGenerator(renderer);
  ENV = pmrem.fromScene(new T.RoomEnvironment(), 0.04).texture;
  camera = new T.PerspectiveCamera(30, 4 / 3, 0.1, 120);
}

/* ---------- materialen ---------- */
const MAT = {};
const own = [];  // per scène aangemaakt, wordt opgeruimd
function P(color, o) { return new T.MeshPhysicalMaterial(Object.assign({ color, roughness: .6, metalness: 0, envMapIntensity: .35 }, o || {})); }
function C(h) { return new T.Color(h); }
function makeMaterials() {
  Object.assign(MAT, {
    skin:     P(0xf2b48f, { roughness: .5, sheen: .35, sheenColor: C(0xffd7c2), sheenRoughness: .5 }),
    skinDeep: P(0xe99a7a, { roughness: .5 }),
    lips:     P(0xa2413f, { roughness: .45 }),
    mouthIn:  P(0x6d2024, { roughness: .6 }),
    tongue:   P(0xe56f78, { roughness: .5 }),
    blush:    new T.MeshStandardMaterial({ color: 0xff6f6f, transparent: true, opacity: .38, roughness: .9, depthWrite: false }),
    eyeWhite: P(0xffffff, { roughness: .12, clearcoat: 1, clearcoatRoughness: .05 }),
    iris:     P(0x4c93da, { roughness: .2, clearcoat: 1, clearcoatRoughness: .05 }),
    pupil:    P(0x0d1018, { roughness: .1, clearcoat: 1 }),
    shine:    new T.MeshBasicMaterial({ color: 0xffffff }),
    hair:     P(0xe8c46c, { roughness: .5, sheen: .8, sheenColor: C(0xfff0bc), sheenRoughness: .35 }),
    hairLite: P(0xf4d88e, { roughness: .45, sheen: .8, sheenColor: C(0xfff6d6), sheenRoughness: .3 }),
    fuzz:     P(0xcfa458, { roughness: .95, sheen: .8, sheenColor: C(0xf6dc9c), sheenRoughness: .5 }),
    brow:     P(0xc99a4e, { roughness: .6 }),
    navy:     P(0x1f3166, { roughness: .8, sheen: .5, sheenColor: C(0x5d78bf), sheenRoughness: .5 }),
    navyDark: P(0x16234a, { roughness: .7 }),
    gold:     P(0xffc23a, { roughness: .25, metalness: .9, envMapIntensity: 1.3 }),
    black:    P(0x17191f, { roughness: .55 }),
    mask:     P(0x16171c, { roughness: .5, side: T.DoubleSide }),
    gloss:    P(0x111216, { roughness: .15, clearcoat: 1, clearcoatRoughness: .08 }),
    white:    P(0xffffff, { roughness: .5 }),
    cream:    P(0xfff4e2, { roughness: .6 }),
    plush:    P(0x8e4b1f, { roughness: 1, sheen: .7, sheenColor: C(0xd9945c), sheenRoughness: .6 }),
    plushDk:  P(0x6c3714, { roughness: 1, sheen: .7, sheenColor: C(0xb67a4c), sheenRoughness: .6 }),
    plushFace:P(0xf0d3a4, { roughness: 1, sheen: .6, sheenColor: C(0xfff6e4), sheenRoughness: .6 }),
    thread:   P(0x141414, { roughness: .9 }),
    grass:    P(0x6fbf4f, { roughness: .95, sheen: .25, sheenColor: C(0xc6f29a) }),
    soil:     P(0x9a7452, { roughness: 1 }),
    trunk:    P(0x8e5c3b, { roughness: .85 }),
    trunkEnd: P(0xd9b285, { roughness: .8 }),
    leaf:     P(0x4fa83d, { roughness: .85, sheen: .35, sheenColor: C(0xb6f08e) }),
    leaf2:    P(0x3d8a36, { roughness: .85, sheen: .35, sheenColor: C(0xa6e486) }),
    cookie:   P(0xd9a159, { roughness: .85 }),
    choc:     P(0x4b2a17, { roughness: .55 }),
    road:     P(0x5b6172, { roughness: .9 }),

function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding;
  t.wrapS = t.wrapT = T.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]);
  t.anisotropy = 4;
  return t;
}
function stripeMat() {
  const t = canvasTex(8, 64, (x, w, h) => { for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#f3f3f1' : '#1d1f27'; x.fillRect(0, i * 8, w, 8); } });
  const m = P(0xffffff, { map: t, roughness: .8, sheen: .5, sheenColor: C(0xffffff) });
  own.push(m, t); return m;
}

/* ---------- geometrie-hulpjes ---------- */
function M(geo, mat) { const m = new T.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m; }
function Sph(r, mat, seg) { seg = seg || 32; return M(new T.SphereGeometry(r, seg, Math.max(12, Math.round(seg * .75))), mat); }
function Cap(r, len, mat) { return M(new T.CapsuleGeometry(r, len, 8, 18), mat); }
function Cyl(rt, rb, h, mat, seg) { return M(new T.CylinderGeometry(rt, rb, h, seg || 32), mat); }
function Box(w, h, d, mat, r) { return M(r ? new T.RoundedBoxGeometry(w, h, d, 4, r) : new T.BoxGeometry(w, h, d), mat); }
function G(parent) { const g = new T.Group(); if (parent) parent.add(g); return g; }
function put(o, x, y, z, parent) { o.position.set(x || 0, y || 0, z || 0); if (parent) parent.add(o); return o; }
function arc(radius, tube, frac, mat, center) {
  const a = Math.PI * 2 * frac;
  const m = M(new T.TorusGeometry(radius, tube, 8, 28, a), mat);
  m.rotation.z = (center === undefined ? -Math.PI / 2 : center) - a / 2;
  return m;
}
function faceFrom(o, cx, cy, cz) { const p = o.position; o.lookAt(p.x * 2 - cx, p.y * 2 - cy, p.z * 2 - cz); }
function starGeo(r, depth) {
  const s = new T.Shape();
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2 + Math.PI / 2, rr = i % 2 ? r * .45 : r;
    i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  const g = new T.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: depth * .4, bevelSize: r * .08, bevelSegments: 2 });
  g.center(); return g;
}
const DOWN = new T.Vector3(0, -1, 0);
function v3(x, y, z) { return new T.Vector3(x, y, z); }
function aim(obj, x, y, z) { obj.quaternion.setFromUnitVectors(DOWN, v3(x, y, z).normalize()); }

  };

}

function lights(scene, o) {
  o = o || {};

  const k = new T.DirectionalLight(o.key || 0xffefd6, o.keyI === undefined ? 1.7 : o.keyI);
  const d = o.dir || [4.5, 8.5, 6];

  k.castShadow = true;
  k.shadow.mapSize.set(2048, 2048);
  const sc = k.shadow.camera; sc.left = -7; sc.right = 7; sc.top = 7; sc.bottom = -7; sc.near = .5; sc.far = 32;
  k.shadow.bias = -.0004; k.shadow.normalBias = .025;
  scene.add(k);
  const rim = new T.DirectionalLight(o.rim || 0xd2e6ff, o.rimI === undefined ? .7 : o.rimI);
  rim.position.set(-5, 4, -6); scene.add(rim);
  scene.environment = ENV;
}
function stip(scene, o) {
  o = o || {};
  const r = o.r || 5;
  const top = o.top || MAT.grass, side = o.side || MAT.soil;
  const d = new T.Mesh(new T.CylinderGeometry(r, r * .95, .5, 120), [side, top, side]);
  d.receiveShadow = true; d.position.y = -.25; scene.add(d);
  const st = canvasTex(128, 128, (x, w, h) => {
    const gr = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(20,30,60,.35)'); gr.addColorStop(1, 'rgba(20,30,60,0)');
    x.fillStyle = gr; x.fillRect(0, 0, w, h);

  const sm = new T.MeshBasicMaterial({ map: st, transparent: true, depthWrite: false }); own.push(st, sm);
  const sh = new T.Mesh(new T.PlaneGeometry(r * 2.6, r * 2.6), sm); sh.rotation.x = -Math.PI / 2; sh.position.y = -.75; scene.add(sh);
  return d;
}
function dayWorld(ctx, o) {
  o = o || {};
  lights(ctx.scene, o.light);
  stip(ctx.scene, o.stip);

    [[-3.6, 4.2, -5.5, 1], [3.8, 4.8, -6, .8], [.6, 5.6, -7, .7]].forEach(([x, y, z, s], i) => {
      const c = put(makeCloud(), x, y, z, ctx.scene); c.scale.setScalar(s);

    });

  (o.flowers || []).forEach(([x, z, c]) => put(makeFlower(c), x, 0, z, ctx.scene));
}

/* ================================================================
   Animatie-hulpjes
   ================================================================ */
let tweens = [];
function tween(dur, fn, done) { tweens.push({ t: 0, dur, fn, done }); }
const ease = { out: k => 1 - Math.pow(1 - k, 3), inOut: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, back: k => 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2) };
function hop(obj, h, dur, spin) {
  if (obj.userData.hopping) return; obj.userData.hopping = true;
  const y0 = obj.position.y, r0 = obj.rotation.y;
  tween(dur || .7, k => { obj.position.y = y0 + Math.sin(k * Math.PI) * (h || .5); if (spin) obj.rotation.y = r0 + ease.inOut(k) * Math.PI * 2; },
    () => { obj.position.y = y0; obj.rotation.y = r0; obj.userData.hopping = false; });
}
function wiggle(obj, amt, dur) {
  if (obj.userData.wig) return; obj.userData.wig = true;
  const z0 = obj.rotation.z;
  tween(dur || .8, k => { obj.rotation.z = z0 + Math.sin(k * Math.PI * 6) * (amt || .2) * (1 - k); }, () => { obj.rotation.z = z0; obj.userData.wig = false; });
}

  ctx.every((t, dt) => car.update(t, dt));
  ctx.tap(car.g, () => { car.flash(); SFX.siren(); });

  const joep = makeJoep({ cap: true }); joep.sit();

function confetti(ctx, n) {
  const cols = [0xff5a5f, 0xffbd17, 0x2b67dc, 0x3ccf91, 0xff8fd1, 0xffffff];
  const mats = cols.map(c => { const m = new T.MeshBasicMaterial({ color: c, side: T.DoubleSide }); own.push(m); return m; });
  const geo = new T.PlaneGeometry(.07, .11);
  const bits = [];
  for (let i = 0; i < n; i++) {
    const m = new T.Mesh(geo, mats[i % mats.length]);
    m.position.set((Math.random() - .5) * 6, Math.random() * 4.5, (Math.random() - .5) * 3 + .5);
    m.userData.v = .4 + Math.random() * .6; m.userData.s = v3(Math.random() * 4, Math.random() * 4, Math.random() * 4);
    ctx.scene.add(m); bits.push(m);
  }
  let burst = 0;
  ctx.every((t, dt) => {
    burst = Math.max(0, burst - dt);
    const sp = reduceMotion ? .2 : 1;
    bits.forEach(b => {
      b.position.y -= dt * b.userData.v * sp * (burst > 0 ? 2 : 1);
      b.position.x += Math.sin(t * 2 + b.userData.v * 9) * dt * .2 * sp;
      b.rotation.x += dt * b.userData.s.x * sp; b.rotation.y += dt * b.userData.s.y * sp;
      if (b.position.y < 0) b.position.y = 4.5;
    });
  });
  return { burst() { burst = 1.5; bits.forEach(b => { b.position.y = 1 + Math.random() * 3.5; }); } };
}

/* ================================================================
   Paginabeheer, camera, interactie
   ================================================================ */
let idx = 0, current = null, view = null, clockT = 0;
const camBase = v3(0, 0, 0), camTarget = v3(0, 0, 0);

function disposeScene(sc) {
  if (!sc) return;
  sc.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  own.splice(0).forEach(x => { if (x && x.dispose) x.dispose(); });
}

function build(i) {
  if (!renderer) return;
  tweens = [];
  if (current) disposeScene(current.scene);
  const scene = new T.Scene();
  const ctx = {
    scene, updates: [], taps: [], chars: [], bg: null,
    every(fn) { this.updates.push(fn); },
    tap(obj, fn) { obj.userData.tap = fn; this.taps.push(obj); },
    char(c) { this.chars.push(c); },
    background(fn) { this.bg = fn; },
  };
  view = PAGES[i].build(ctx);
  current = ctx;
  frame();
  const sky = PAGES[i].sky;
  stage.style.background = 'linear-gradient(' + sky[0] + ',' + sky[1] + ')';
}

function frame() {
  if (!view || !camera) return;
  const fov = camera.fov * Math.PI / 180, t = Math.tan(fov / 2);
  const dist = Math.max(view.h / 2 / t, view.w / 2 / (t * camera.aspect));
  const d = v3(view.dir[0], view.dir[1], view.dir[2]).normalize().multiplyScalar(dist);
  camTarget.set(view.target[0], view.target[1], view.target[2]);
  camBase.copy(camTarget).add(d);
  camera.position.copy(camBase); camera.lookAt(camTarget);
}

function fit() {
  const bw = stageBox.clientWidth, bh = stageBox.clientHeight;
  if (!bw || !bh) return;
  const aspect = bw / bh < 1.02 ? 1 : 4 / 3;
  const w = Math.floor(Math.min(bw, bh * aspect)), h = Math.floor(w / aspect);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  if (!renderer) return;
  renderer.setSize(w, h, false);
  camera.aspect = aspect; camera.updateProjectionMatrix();
  frame();
}

function renderText(i) {
  const p = PAGES[i];
  let html = p.html;
  if (p.end) html += '<br><button class="chip" type="button" id="again">Nog een keer lezen</button>';
  textEl.innerHTML = html;
  const again = $('again'); if (again) again.addEventListener('click', () => go(0));
  canvas.setAttribute('aria-label', p.alt);
  prevBtn.disabled = i === 0; nextBtn.disabled = i === PAGES.length - 1;
  [...dotsEl.children].forEach((d, j) => d.setAttribute('aria-current', j === i ? 'true' : 'false'));
  tapEl.hidden = !renderer || !p.tap; tapText.textContent = p.tap || '';
}

let switching = false;
function go(i) {
  if (i < 0 || i >= PAGES.length || i === idx || switching) return;
  switching = true;
  const swap = () => {
    idx = i; build(i); renderText(i);
    stage.classList.remove('fade'); textEl.classList.remove('out');
    if (PAGES[i].enter) PAGES[i].enter();
    switching = false;
  };
  if (reduceMotion) { swap(); return; }
  stage.classList.add('fade'); textEl.classList.add('out');
  setTimeout(swap, 200);
}

prevBtn.addEventListener('click', () => go(idx - 1));
nextBtn.addEventListener('click', () => go(idx + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(idx + 1);
  else if (e.key === 'ArrowLeft') go(idx - 1);
});

// tikken en vegen op de plaat
const ray = new T.Raycaster(), ptr = new T.Vector2();
let down = null;
stage.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
stage.addEventListener('pointerup', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.3) { go(idx + (dx < 0 ? 1 : -1)); return; }
  if (Math.hypot(dx, dy) > 12 || !current || !renderer) return;
  ac();
  const r = canvas.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(current.taps, true);
  for (const h of hits) {
    let o = h.object;
    while (o && !o.userData.tap) o = o.parent;
    if (o) { o.userData.tap(); tapEl.hidden = true; return; }
  }
  if (current.bg) current.bg();
});

/* ---------- lus ---------- */
const clock = renderer ? new T.Clock() : null;
function step(dt) {
  clockT += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
  }
  current.updates.forEach(f => f(clockT, dt));
  current.chars.forEach(c => c.idle(clockT, dt));
  if (!reduceMotion) {
    camera.position.set(camBase.x + Math.sin(clockT * .25) * .08, camBase.y + Math.sin(clockT * .33) * .04, camBase.z);
    camera.lookAt(camTarget);
  }
}
function loop() {
  requestAnimationFrame(loop);
  if (document.hidden || !current) return;
  step(Math.min(.05, clock.getDelta()));
  renderer.render(current.scene, camera);
}

/* ---------- start ---------- */
if (window.ResizeObserver) new ResizeObserver(fit).observe(stageBox);
window.addEventListener('resize', fit);
fit();
build(0); renderText(0);
fit();
if (renderer) {
  current.updates.forEach(f => f(0, 0)); current.chars.forEach(c => c.idle(0, 0));
  renderer.render(current.scene, camera);
  loop();
}
window.__book = { go: i => { switching = false; idx = -1; go(i); }, pages: PAGES.length, ff: sec => { for (let k = 0; k < sec * 30; k++) step(1 / 30); } };
})();
</script>
